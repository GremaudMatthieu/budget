services:
    # OAuth controller
    App\Presentation\User\HTTP\Controllers\SignUpOrAuthenticateAGoogleUserController:
        tags: ['controller.service_arguments']

    # OAuth repository
    App\UserContext\Domain\UserOAuthRepository:
        class: App\UserContext\Infrastructure\Persistence\Repositories\DoctrineUserOAuthRepository
        arguments:
            - '@doctrine.orm.entity_manager'

    # OAuth command handler
    App\UserContext\Application\Commands\SignUpOrAuthenticateWithOAuth2Handler:
        tags: ['messenger.message_handler']
        
    # Add frontend URL parameter
parameters:
    app.frontend_url: '%env(FRONTEND_URL)%'